---
name: Build, Test & Deploy

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - scripts/**
      - configuration/**
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  build-image:
    name: Build Image
    uses: georglauterbach/k8s-dns/.github/workflows/generic_build.yml@main

  publish-images:
    name: Publish Image
    needs: [build-image]
    permissions:
      contents: read # Required to checkout the repository
      packages: write # Required to push the container image
    uses: georglauterbach/k8s-dns/.github/workflows/generic_publish.yml@main
    secrets:
      GHCR_REPOSITORY: ${{ secrets.GHCR_REPOSITORY }}
      DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
